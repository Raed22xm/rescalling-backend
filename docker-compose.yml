version: '3.8'

services:
  backend:
    build: .
    ports:
      - "4001:4001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/rescalling
      - PORT=4001
      # Add other environment variables here (e.g., CLOUDINARY_*, JWT_SECRET)
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
